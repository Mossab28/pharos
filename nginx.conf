server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Multi-page: /send/ and /receive/
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location = /send {
    return 301 /send/;
  }

  location = /receive {
    return 301 /receive/;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
